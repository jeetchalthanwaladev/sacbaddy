<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education & Skills</title>
    <link rel="stylesheet" href="../style/style.css" />
    <link rel="stylesheet" href="../style/skills.css" />
</head>
<body>
    <section class="skills-section" id="resume">
        <div class="skills-container">
            <div class="section-tag skills-tag">Education & Skills</div>

            <div class="skills-grid">
                <div class="edu-card">
                    <div class="edu-item">
                        <span class="edu-year">2018-2020</span>
                        <h4 class="edu-title">Ph.D in Horriblensess</h4>
                        <p class="edu-school">University Of Evil Doing</p>
                    </div>

                    <div class="edu-item">
                        <span class="edu-year">2013-2016</span>
                        <h4 class="edu-title">Bsc. in Computer Science</h4>
                        <p class="edu-school">World University</p>
                    </div>

                    <div class="edu-item">
                        <span class="edu-year">2010-2012</span>
                        <h4 class="edu-title">Graphic Artist Training</h4>
                        <p class="edu-school">Graphic Master Institute</p>
                    </div>
                </div>
                <div class="skills-list">
                    <div class="skill-row">
                        <div class="skill-percent" data-value="92">92%</div>
                        <div class="skill-content">
                            <span class="skill-name">HTML5</span>
                            <div class="skill-track">
                                <div class="skill-bar" style="width: 92%;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="skill-row">
                        <div class="skill-percent" data-value="85">85%</div>
                        <div class="skill-content">
                            <span class="skill-name">React JS</span>
                            <div class="skill-track">
                                <div class="skill-bar" style="width: 85%;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="skill-row">
                        <div class="skill-percent" data-value="90">90%</div>
                        <div class="skill-content">
                            <span class="skill-name">Vue Js</span>
                            <div class="skill-track">
                                <div class="skill-bar" style="width: 90%;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="skill-row">
                        <div class="skill-percent" data-value="88">88%</div>
                        <div class="skill-content">
                            <span class="skill-name">Ui/Ux</span>
                            <div class="skill-track">
                                <div class="skill-bar" style="width: 88%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
