<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact</title>
        <link rel="stylesheet" href="../style/contact.css" />
    </head> 
    <body>
        <section class="contact-page" id="contact">
            <div class="contact-shell">
                <div class="contact-copy">
                    <h2>What's your story?<br><span>Get in touch</span></h2>
                    <p>Always available for freelancing if the right project comes along. Feel free to contact me.</p>

                    <ul class="contact-list">
                        <li class="contact-item">
                            <span class="icon-wrap">
                                <img class = "contact-img" src="../src/contact/location.png" alt="Location Icon" />
                            </span>
                            <span>123 Street New York City, United States Of America 750065.</span>
                        </li>
                        <li class="contact-item">
                            <span class="icon-wrap">
                                <img class = "contact-img" src="../src/contact/email.png" alt="Email Icon" />
                            </span>
                            <a href="mailto:support@domain.com">support@domain.com</a>
                        </li>
                        <li class="contact-item">
                            <span class="icon-wrap">
                                <img class = "contact-img" src="../src/contact/contact.png" alt="Phone Icon" />
                            </span>
                            <a href="tel:+04496969693636">+044 9696 9696 3636</a>
                        </li>
                    </ul>
                </div>

                <div class="form-panel">
                    <h3>Say Something</h3>
                    <form class="contact-form">
                        <div class="field-row">
                            <input id="full-name" type="text" placeholder="Full name" placeholder = "Full Name"/>
                            <input id="email" type="email" placeholder="Email address" placeholder = "Email Address"/>
                        </div>

                        <input id="subject" type="text" placeholder="Subject" placeholder = "Subject"/>

                        <textarea id="message" rows="6" placeholder="Type comment" placeholder = "Type your message here..."></textarea>

                        <button type="submit">Send Message</button>
                    </form>
                </div>
            </div>

            <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.865498813894!2d144.96880199999998!3d-37.81661929999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d4c2b349649%3A0xb6899234e561db11!2sEnvato%20Pty%20Ltd!5e0!3m2!1sen!2sin!4v1791183175752!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </section>
    </body> 
</html>
